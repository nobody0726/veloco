name: veloco

# Local smoke deployment for the future HTTP server. The binary is
# expected from Task 8; `docker compose up --build` fails until
# build/uring/veloco-httpd exists. No production registry or host is
# assumed.
services:
  httpd:
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
      args:
        VELOCO_HTTPD_BINARY: ${VELOCO_HTTPD_BINARY:-build/uring/veloco-httpd}
    image: veloco-httpd:local
    ports:
      - "${VELOCO_HOST_PORT:-8080}:8080"
    environment:
      VELOCO_HTTP_ADDR: 0.0.0.0
      VELOCO_HTTP_PORT: "8080"
    restart: "no"
